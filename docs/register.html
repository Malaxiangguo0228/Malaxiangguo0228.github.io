<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <script src="./scripts.js" defer></script>
  <script src="./register.js" defer></script>
</head>
<body>
  <!-- 现代化提示系统 -->
  <div class="overlay" id="overlay"></div>
  <div class="notification" id="notification">
    <button class="notification-close">&times;</button>
    <div class="notification-icon"></div>
    <div class="notification-message" id="notificationMessage"></div>
    <button class="notification-button" id="notificationButton">确定</button>
  </div>

  <header>
    <div class="logo">
      <img src="./图标/网站logo-1.png" alt="Logo">
      <span>Nothing</span>
    </div>
  </header>
  <hr class="divider">
  <main>
    <div class="login-container">
      <h1>注册 <span>Nothing</span> 账户</h1>
      <button class="email-register-btn">
        <img class="email-icon" src="./图标/邮箱.png" alt="Email Icon">
        使用手机号注册
      </button>
      <p class="separator">or</p>
      <form id="registerForm">
        <input type="email" id="email" placeholder="邮箱" required>
        <input type="password" id="password" placeholder="密码" required>
        <input type="password" id="confirmPassword" placeholder="确认密码" required>
        <button type="submit" class="login-btn">完成注册</button>
      </form>
      <p class="register-link">
        已有账号？<a href="./index.html">返回登录</a>
      </p>
    </div>
  </main>
  <div id="particles-js"></div>
</body>
</html>
